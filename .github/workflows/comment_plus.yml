name: Daily Comment plus

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if daily task already ran today
        id: precheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          RAN=$(gh run list --workflow daily_task.yml --limit 30 \
                --json startedAt,status \
                --jq "[.[] | select(.status != \"queued\")
                       | select((((.startedAt | fromdateiso8601) + 28800)
                                 | strftime(\"%Y-%m-%d\")) == \"$TODAY\")]
                      | length" 2>/dev/null || true)
          if [ -n "$RAN" ] && [ "$RAN" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "daily_task 今天(北京时间 $TODAY)已运行过，跳过本次执行"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "daily_task 今天(北京时间 $TODAY)尚未运行或检查失败，继续执行"
          fi

      - name: Set up Python
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.precheck.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run comment script
        if: steps.precheck.outputs.skip != 'true'
        env:
          ZAIMANHUA_COOKIE: ${{ secrets.ZAIMANHUA_COOKIE }}
          ZAIMANHUA_COOKIE_1: ${{ secrets.ZAIMANHUA_COOKIE_1 }}
          ZAIMANHUA_COOKIE_2: ${{ secrets.ZAIMANHUA_COOKIE_2 }}
          ZAIMANHUA_COOKIE_3: ${{ secrets.ZAIMANHUA_COOKIE_3 }}
          ZAIMANHUA_COOKIE_4: ${{ secrets.ZAIMANHUA_COOKIE_4 }}
          ZAIMANHUA_COOKIE_5: ${{ secrets.ZAIMANHUA_COOKIE_5 }}
          ZAIMANHUA_USERNAME: ${{ secrets.ZAIMANHUA_USERNAME }}
          ZAIMANHUA_PASSWORD: ${{ secrets.ZAIMANHUA_PASSWORD }}
          ZAIMANHUA_USERNAME_1: ${{ secrets.ZAIMANHUA_USERNAME_1 }}
          ZAIMANHUA_PASSWORD_1: ${{ secrets.ZAIMANHUA_PASSWORD_1 }}
          ZAIMANHUA_USERNAME_2: ${{ secrets.ZAIMANHUA_USERNAME_2 }}
          ZAIMANHUA_PASSWORD_2: ${{ secrets.ZAIMANHUA_PASSWORD_2 }}
          ZAIMANHUA_USERNAME_3: ${{ secrets.ZAIMANHUA_USERNAME_3 }}
          ZAIMANHUA_PASSWORD_3: ${{ secrets.ZAIMANHUA_PASSWORD_3 }}
          ZAIMANHUA_USERNAME_4: ${{ secrets.ZAIMANHUA_USERNAME_4 }}
          ZAIMANHUA_PASSWORD_4: ${{ secrets.ZAIMANHUA_PASSWORD_4 }}
          ZAIMANHUA_USERNAME_5: ${{ secrets.ZAIMANHUA_USERNAME_5 }}
          ZAIMANHUA_PASSWORD_5: ${{ secrets.ZAIMANHUA_PASSWORD_5 }}
        run: python src/comment_plus.py
